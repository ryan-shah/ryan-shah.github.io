---
layout: default
title: Personal Projects
---
<div class="container">
	<div class="jumbotron">
		<h1> {{ page.title }} </h1>
	</div>

<ul class="projects">
	{% for post in site.posts %}
		{% if post.type == "personal" %}
		<li><a href="{{ post.url }}">{{ post.title }}</a></li>
		{% endif %}
	{% endfor %}
</ul>
</div>
