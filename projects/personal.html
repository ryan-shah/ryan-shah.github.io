---
layout: default
title: Personal Projects
---
<div class="container">
	<div class="jumbotron">
		<h1> {{ page.title }} </h1>
	</div>
</div>
<div class="container">
<div class="card-columns">
	{% for post in site.posts %}
		{% if post.type == "personal" %}
	<div class="card text-white bg-info mb-3">
		<img class="card-img-top" style="height: 200px; width: 100%;" src="/img/{{ post.img }}">
		<div class="card-body">
			<h5 class="card-title">{{ post.title }}</h5> 
			<p class="card-text">{{ post.summary }}</p>
		</div>
		<div class="card-footer">
			<a class="btn btn-secondary btn-sm" href="{{ post.url }}" role="button">View</a>
		</div>
	</div>
	<br>
		{% endif %}
	{% endfor %}
</div>
</div>
