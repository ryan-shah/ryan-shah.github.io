---
layout: default
title: School Projects
---
<div class="container">
	<div class="jumbotron">
		<h1> {{ page.title }} </h1>
	</div>
</div>
<div class="container">
	{% for post in site.posts %}
		{% if post.type == "school" %}
	<div class="card text-white bg-primary mb-3>
		<img class="card-img-top" src="/_img/{{ post.img }}">
		<div class="card-header">{{ post.title }}</div>
		<div class="card-body">
			<p class="card-text">{{ post.summary }}</p>
		</div>
		<div class="card-footer">
			<a class="btn btn-secondary btn-sm" href="{{ post.url }}" role="button">View</a>
		</div>
		<a href="{{ post.url }}">{{ post.title }}</a>
	</div>
		{% endif %}
	{% endfor %}
</div>
